# Runs the live fund discovery (Nasdaq Trader, Yahoo, and Alpaca / EODHD / FMP if
# their keys are set as repository secrets) and commits config/discovered.json,
# so the app ships with every known leveraged ETF/ETN/ETP.
name: discovery-snapshot
on:
  schedule:
    - cron: "17 11 * * *"   # daily, after the US symbol directories update
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - app/discovery.py
      - app/classify.py
      - app/exchanges.py
      - scripts/snapshot_universe.py
      - .github/workflows/discovery-snapshot.yml

permissions:
  contents: write

concurrency:
  group: discovery-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Discover leveraged funds
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/snapshot_universe.py config/discovered.json
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/discovered.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update leveraged fund snapshot ($(python -c 'import json;print(json.load(open("config/discovered.json"))["count"])') funds)"
          git push
