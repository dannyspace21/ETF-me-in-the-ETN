# Quick start:     docker compose up -d                 -> http://localhost:8000
# With local AI:   docker compose --profile ai up -d    (Ollama, fully offline LLM)
# Auto-upgrades:   docker compose --profile autoupdate up -d
services:
  app:
    image: ${IMAGE:-ghcr.io/dannyspace21/etf-me-in-the-etn:latest}
    build: .
    container_name: etf-me-in-the-etn
    restart: unless-stopped
    ports: ["${PORT:-8000}:8000"]
    env_file: [{path: .env, required: false}]
    volumes:
      - etfme-data:/data
      # Override the fund list / alert ladder without rebuilding:
      # - ./config:/app/config:ro
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  ollama:  # local, offline LLM for "Ask the AI" (set LLM_PROVIDER=ollama in .env)
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes: [ollama-models:/root/.ollama]
    # First run: docker compose exec ollama ollama pull llama3.1:8b

  watchtower:  # pulls new images of `app` and restarts it automatically
    image: containrrr/watchtower:latest
    profiles: ["autoupdate"]
    restart: unless-stopped
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    command: --label-enable --cleanup --interval 21600

volumes:
  etfme-data:
  ollama-models:
