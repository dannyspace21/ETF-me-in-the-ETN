<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ETF Me in the ETN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2029"/><stop offset="1" stop-color="#0e1013"/></linearGradient>
    <linearGradient id="poo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86b34"/><stop offset="1" stop-color="#6e4220"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#2b323d" stroke-width="2"/>
  <!-- the crash going in -->
  <polyline points="12,24 26,38 34,32 50,58" fill="none" stroke="#ff5c5c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the poop -->
