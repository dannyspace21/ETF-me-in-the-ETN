  <circle cx="53" cy="82" r="8" fill="#fff"/><circle cx="75" cy="82" r="8" fill="#fff"/>
  <circle cx="55.5" cy="79.5" r="3.8" fill="#111"/><circle cx="77.5" cy="79.5" r="3.8" fill="#111"/>
  <!-- grin -->
