# ETF Me in the ETN — CURATED funds.
#
# You don't need to list funds here any more: the discovery job (app/discovery.py)
# scans the US symbol directories, Alpaca, Yahoo, EODHD and FMP every
# DISCOVERY_HOURS and tracks EVERY leveraged ETF / ETN / ETP it finds, US and
# international, bull and bear, and alerts you when a new one lists.
#
# This file is for:
#   * pinning funds with hand-written metadata (it wins over what discovery guesses)
#   * an offline / demo fallback universe
#   * `exclude:` — tickers you never want to see, even if discovery finds them
#
#   ticker:    symbol. Non-US listings use Yahoo suffixes: QQQ3.L (London), LQQ.PA (Paris),
#              HQU.TO (Toronto), 7226.HK, 1570.T (Tokyo), 122630.KS (Korea), 00631L.TW, GGUS.AX
#   lev:       leverage multiple (1.25, 1.5, 2, 3, 5 …)
#   direction: long (default) | short
#   type:      ETF | ETN | ETP
#   group:     broad | sector | intl | commodity | rates | single-stock | crypto | volatility | currency
#   under:     what it multiplies
exclude: []

